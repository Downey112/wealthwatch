    <style>
      /* Financial Dark Theme - Pitch Black Background */
      html { background-color: #000000; }
      body { margin: 0; padding: 0; }

      /* The Loader - Matching your Lime/Black Screenshot */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000000;
        gap: 1.5rem;
        font-family: 'Inter', sans-serif;
        z-index: 9999;
      }

      .loader-icon {
        font-size: 3rem;
        filter: drop-shadow(0 0 10px rgba(190, 242, 100, 0.3));
        animation: pulse 2s ease-in-out infinite;
      }

      .loader-text {
        color: #ffffff;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-size: 0.75rem;
        opacity: 0.8;
      }

      .loader-bar {
        width: 180px;
        height: 2px;
        background: #1a1a1a;
        border-radius: 99px;
        overflow: hidden;
      }

      .loader-bar-fill {
        height: 100%;
        width: 30%;
        background: #bef264; /* Lime green from your Launch button */
        box-shadow: 0 0 15px rgba(190, 242, 100, 0.5);
        border-radius: 99px;
        animation: slide 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; }
      }

      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>

  <body>
    <div id="initial-loader">
      <div class="loader-icon">💰</div>
      <div class="loader-text">Initializing WealthWatch</div>
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.addEventListener('load', () => {
        const root = document.getElementById('root');
        const observer = new MutationObserver(() => {
          if (root.children.length > 0) {
            const loader = document.getElementById('initial-loader');
            if (loader) {
              loader.style.opacity = '0';
              loader.style.transition = 'opacity 0.4s ease-out';
              setTimeout(() => loader.remove(), 400);
            }
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      });
    </script>
  </body>
</html>
