name: Keep database awake

# Supabase pauses free projects with too little database activity over a week
# ("a few user requests to the database each day"). /api/health reads the
# users table, so calling it daily keeps the live site working.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    # Set the APP_URL repository variable to the live site, e.g. https://wealthwatch.vercel.app
    if: vars.APP_URL != ''
    steps:
      - run: curl --fail --silent --show-error --max-time 60 "${{ vars.APP_URL }}/api/health"
